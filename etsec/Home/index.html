<!DOCTYPE html>

    <link rel="stylesheet" href="./style.css" />

    <link

  <body>

	  <!-- hero section -->

				<img src="/media/images/branding.png" alt="">
	
			</div>
			<div class="hero-right col-sm-8">
				<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
					<div class="carousel-inner">
					  <div class="carousel-item active" data-bs-interval="10000">
						<img src="/media/images/2.jpg" class="d-block w-100" alt="...">
						<div class="carousel-caption d-none d-md-block">
							<h5>First slide label</h5>
							<p>Some representative placeholder content for the first slide.</p>
						  </div>
					  </div>
					  <div class="carousel-item" data-bs-interval="10000">
						<img src="/media/images/bc1.avif" class="d-block w-100" alt="...">

						  </div>
					  </div>

							<h5>First slide label</h5>
							<p>Some representative placeholder content for the first slide.</p>
						  </div>
					  </div>

	
					</div>
					<button class="carousel-control-prev " type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
					  <span class="carousel-control-prev-icon btn-left" aria-hidden="true"></span>
					  <span class="visually-hidden ">Previous</span>
					</button>
					<button class="carousel-control-next " type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
					  <span class="carousel-control-next-icon btn-right" aria-hidden="true"></span>
					  <span class="visually-hidden">Next</span>
					</button>
				  </div>
			</div>

		</div>

		
	  </section>
    </div>

    <script src="./index.js"></script>
    <script
